services:
  marketbroker:
    build:
      dockerfile: ./Dockerfile
    image: registry.tradefiapp.com:5443/marketbroker:0.4.0
    container_name: marketbroker
    hostname: marketbroker
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8090:8090"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - kafka0
      - questdb
      - kafka-connect
      - mysql8
      - loki
      - grafana
#    volumes:
#      - $HOME/.m2:/root/.m2
    networks:
      - marketbroker_net
    profiles: [prop-trade-bundle,sdk]
#    healthcheck:
#      test: [ "CMD", "curl", "-f", "http://localhost:8090/health" ]
#      interval: 30s
#      timeout: 10s
#      retries: 3
#      start_period: 30s

  kafka0:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.1
    container_name: kafka0
    hostname: kafka0
    ports:
      - "127.0.0.1:18081:18081"
      - "127.0.0.1:18082:18082"
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:9644:9644"
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:19092,external://0.0.0.0:9092
      # Address the broker advertises to clients that connect to the Kafka API.
      # Use the internal addresses to connect to the Redpanda brokers'
      # from inside the same Docker network.
      # Use the external addresses to connect to the Redpanda brokers'
      # from outside the Docker network.
      - --advertise-kafka-addr internal://kafka0:19092,external://localhost:9092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      # Address the broker advertises to clients that connect to the HTTP Proxy.
      - --advertise-pandaproxy-addr internal://kafka0:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      # Redpanda brokers use the RPC API to communicate with each other internally.
      - --rpc-addr kafka0:33145
      - --advertise-rpc-addr kafka0:33145
      # Mode dev-container uses well-known configuration properties for development in containers.
      - --mode dev-container
      # Tells Seastar (the framework Redpanda uses under the hood) to use 1 core on the system.
      - --smp 1
      - --default-log-level=info
    volumes:
      - kafka0:/var/lib/redpanda/data
    networks:
      - marketbroker_net
    profiles: [prop-trade-bundle,infra,sdk]
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]     # "-X", "user=superuser", "-X", "pass=secretpassword"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  console:
    image: docker.redpanda.com/redpandadata/console:v3.3.1
    container_name: kafka-console
    hostname: kafka-console
    entrypoint: /bin/sh
    command: -c "echo \"$$CONSOLE_CONFIG_FILE\" > /tmp/config.yml; /app/console"
    environment:
      CONSOLE_ENTERPRISE_LICENSE: ""
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["kafka0:19092"]
        schemaRegistry:
          enabled: false
          urls: ["http://kafka0:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://kafka0:9644"]
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - kafka0
    networks:
      - marketbroker_net
    profiles: [prop-trade-bundle,infra,sdk]

  mysql8:
    image: mysql:8.0.40-debian
    container_name: mysql8
    hostname: mysql8
    environment:
#      - MYSQL_DATABASE=marketbroker
      - MYSQL_PASSWORD=password
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_USER=user
    cap_add:
      - SYS_NICE  # CAP_SYS_NICE
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - marketbroker_net
    profiles: [prop-trade-bundle,infra,sdk]
    restart: on-failure
    healthcheck:
#      test: ["CMD-SHELL", "mysql -h localhost -u root -p$$MYSQL_ROOT_PASSWORD" ]
      test: ["CMD", "mysqladmin", "-u$MYSQL_USER", "-p$MYSQL_PASSWORD", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    container_name: phpmyadmin
    hostname: phpmyadmin
    environment:
      - PMA_HOST=mysql8
      - PMA_PORT=3306
      - MYSQL_PASSWORD=password
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_USER=user
    ports:
      - "127.0.0.1:8082:80"
    networks:
      - marketbroker_net
    profiles: [prop-trade-bundle,infra,sdk]

  questdb:
    image: questdb/questdb:9.2.0
    container_name: questdb
    hostname: questdb
    ports:
      - "0.0.0.0:8812:8812"
      - "0.0.0.0:9000:9000"
      - "127.0.0.1:9009:9009"
      - "127.0.0.1:9003:9003"
#    extra_hosts:
#      - "host.docker.internal:host-gateway"
#    user: "501"
    environment:
      - QDB_METRICS_ENABLED=TRUE
      - QDB_WRITERS=stdout,http.min
      - QDB_CAIRO_SQL_COPY_ROOT=/var/lib/questdb/questdb_import
      - QDB_TELEMETRY_ENABLED=false
      - QDB_PG_READONLY_USER_ENABLED=true
      - QDB_PG_READONLY_USER=ro_user
      - QDB_PG_READONLY_PASSWORD=ro_password
    volumes:
#      - ./docker/questdb-data:/root/.questdb
      - ./docker/questdb-import:/var/lib/questdb/questdb_import
      - questdb-data:/var/lib/questdb
    networks:
      - marketbroker_net
    profiles: [prop-trade-bundle,infra,lab,sdk]

  kafka-connect:
#    image: ueisele/apache-kafka-connect-standalone:3.7.0
    image: cricketeerone/apache-kafka-connect:4.0.0
    container_name: kafka-connect
    hostname: kafka-connect
    depends_on:
      - kafka0
      - questdb
    ports:
      - "127.0.0.1:8083:8083"
#    extra_hosts:
#      - "host.docker.internal:host-gateway"
#    user: "1001"
    volumes:
      - ./docker/kafka_connect_plugins:/etc/kafka-connect/jars     # Mount local directory for plugins
#      - ./docker/kafka_connect_plugins:/opt/bitnami/kafka/plugins
#      - ./docker/kafka_connect_data:/bitnami
#      - ./docker/kafka_connect_config/connect-standalone.properties:/opt/bitnami/kafka/config/connect-standalone.properties
#      - ./docker/kafka_connect_config/questdb-connector.properties:/opt/bitnami/kafka/config/questdb-connector.properties
#    command: /opt/bitnami/kafka/bin/connect-standalone.sh /opt/bitnami/kafka/config/connect-standalone.properties /opt/bitnami/kafka/config/questdb-connector.properties
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka0:19092
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: false
      CONNECT_GROUP_ID: kafka_connect
      CONNECT_CONFIG_STORAGE_TOPIC: connect_config
      CONNECT_OFFSET_STORAGE_TOPIC: connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect_status
      # Cannot be higher than the number of brokers in the Kafka cluster
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka_connect
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 5000
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1

      # Connect client overrides
      CONNECT_TASK_SHUTDOWN_GRACEFUL_TIMEOUT_MS: 30000
      # Connect consumer overrides
      CONNECT_CONSUMER_MAX_POLL_RECORDS: 500

      CONNECT_PLUGIN_PATH: /etc/kafka-connect/jars
    networks:
      - marketbroker_net
    profiles: [prop-trade-bundle,infra,sdk]

#    command:
#      - bash
#      - -c
#      - |
#        echo "Waiting for Kafka Connect to start listening on localhost ⏳"
#        while : ; do
#          curl_status=$$(curl -s -o /dev/null -w %{http_code} http://localhost:8083/connectors)
#          echo -e $$(date) " Kafka Connect listener HTTP state: " $$curl_status " (waiting for 200)"
#          if [ $$curl_status -eq 200 ] ; then
#            break
#          fi
#          sleep 5
#        done
#        echo -e "\n--\n+> Registering QuestDB Connector"
#        curl -X POST -H "Content-Type: application/json" -d '{"name":"questdb-connect","config":{"topics":"MARKETBROKER.LOCAL.TICKSTREAM_TOPIC","connector.class":"io.questdb.kafka.QuestDBSinkConnector","tasks.max":"1","key.converter":"org.apache.kafka.connect.storage.StringConverter","value.converter":"org.apache.kafka.connect.json.JsonConverter","value.converter.schemas.enable":"false","client.conf.string":"http::addr=questdb;", "include.key":false, "timestamp.field.name":"t", "timestamp.units":"millis"}}' localhost:8083/connectors
#        sleep infinity

# test curl -X POST -H "Content-Type: application/json" -d '{"name":"questdb-marketbroker","config":{"topics":"TICKSTREAM_TOPIC","connector.class":"io.questdb.kafka.QuestDBSinkConnector","tasks.max":"1","key.converter":"org.apache.kafka.connect.storage.StringConverter","value.converter":"org.apache.kafka.connect.json.JsonConverter","value.converter.schemas.enable":"false","client.conf.string":"http::addr=questdb;", "timestamp.kafka.native": true, "include.key": false}}' localhost:8083/connectors
# curl -X POST -H "Content-Type: application/json" -d '{"name":"marketbroker-questdb","config":{"topics":"MARKETBROKER.LOCAL.TICKSTREAM_TOPIC","connector.class":"io.questdb.kafka.QuestDBSinkConnector","tasks.max":"1","key.converter":"org.apache.kafka.connect.storage.StringConverter","value.converter":"org.apache.kafka.connect.json.JsonConverter","value.converter.schemas.enable":"false","client.conf.string":"http::addr=questdb;", "include.key":false, "doubles":"b,a,m", "timestamp.field.name":"t", "timestamp.units":"millis"}}' localhost:8083/connectors

  grafana:
    container_name: grafana
    hostname: grafana
    image: grafana/grafana:12.1.4
    # See: https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#override-configuration-with-environment-variables
    environment:
      #      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - QDB_CLIENT_PG_HOST=questdb
      - QDB_CLIENT_PG_PORT=8812
      - QDB_CLIENT_PG_USER=admin
      - QDB_CLIENT_PG_PASSWORD=quest
      - QDB_SSL_PG_MODE=disable
      - PG_SELECT_CACHE_ENABLED=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor metricsSummary

    ports:
      - "127.0.0.1:4000:3000"
    # See: https://grafana.com/docs/grafana/latest/setup-grafana/configure-docker/
    volumes:
      - ./docker/grafana/var_lib_grafana:/var/lib/grafana/
      - ./docker/grafana/etc_grafana:/etc/grafana/
    networks:
      - marketbroker_net
    profiles: [prop-trade-bundle,infra,sdk]

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: prometheus
    hostname: prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker/prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    #    expose:
    #      - 9090
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - marketbroker_net
    profiles: [prop-trade-bundle,infra,sdk]


  loki:
    container_name: loki
    hostname: loki
    image: grafana/loki:3.5.8
    command:
      -config.file=/etc/loki/loki-config.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./docker/loki-config.yml:/etc/loki/loki-config.yml
    networks:
      - marketbroker_net
    profiles: [prop-trade-bundle,infra,sdk]


  tempo:
    container_name: tempo
    hostname: tempo
    image: grafana/tempo:2.9.0
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./docker/tempo.yml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:14268:14268"  # jaeger ingest
      - "127.0.0.1:3200:3200"   # tempo
      - "127.0.0.1:9095:9095" # tempo grpc
      - "127.0.0.1:4317:4317"  # otlp grpc
      - "127.0.0.1:4318:4318"  # otlp http
      - "127.0.0.1:9411:9411"   # zipkin
    networks:
      - marketbroker_net
    profiles: [prop-trade-bundle,infra,sdk]
    depends_on:
      - memcached

  memcached:
    image: memcached:1.6.39
    container_name: memcached
    hostname: memcached
    ports:
      - "127.0.0.1:11211:11211"
    environment:
      - MEMCACHED_MAX_MEMORY=64m # Set the maximum memory usage
      - MEMCACHED_THREADS=2 # Number of threads to use
    networks:
      - marketbroker_net
    profiles: [prop-trade-bundle,infra,sdk]


  solana-event-listener:
#    build:
#      dockerfile: ./Dockerfile
    image: registry.tradefiapp.com:5443/solana-event-listener:v1
    container_name: solana-event-listener
    hostname: solana-event-listener
    #    ports:
    #      - "5000:5000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka0:19092
      - MYSQL_HOST=mysql8
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=solana_db
      - MYSQL_USER=solana_user
      - MYSQL_PASSWORD=password
      - SOLANA_RPC=https://api.devnet.solana.com
      - SOLANA_WEBSOCKET=wss://api.devnet.solana.com
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - marketbroker_net
    profiles: [prop-trade-bundle]
    depends_on:
      kafka0:
        condition: service_healthy
      mysql8:
        condition: service_healthy

  tradefi-app:
    container_name: tradefi-app
    hostname: tradefi-app
    image: registry.tradefiapp.com:5443/tradefi-app:1.0.0
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - marketbroker_net
    profiles: [prop-trade-bundle]
    depends_on:
      mongodb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    restart: always

  mongodb:
    image: mongo:8.0.16-noble
    container_name: mongodb
    hostname: mongodb
    restart: always
    ports:
      - "127.0.0.1:27017:27017" # Expose MongoDB on the default port
    environment:
      MONGO_INITDB_ROOT_USERNAME: root # Set the admin username
      MONGO_INITDB_ROOT_PASSWORD: password # Set the admin password
    volumes:
      - mongo-data:/data/db # Persist MongoDB data
      - mongo-config:/data/configdb # Persist MongoDB configuration
    networks:
      - marketbroker_net
    profiles: [prop-trade-bundle]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", 'db.runCommand("ping").ok']
      interval: 30s
      timeout: 5s
      retries: 3

  mongo-express:
    container_name: mongo-express
    hostname: mongo-express
    image: mongo-express:1.0-20-alpine3.19
    restart: always
    ports:
      - "127.0.0.1:8084:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://root:password@mongodb:27017/
    networks:
      - marketbroker_net
    profiles: [prop-trade-bundle]
    depends_on:
      - mongodb


  nginx-tradefi:
    container_name: nginx-tradefi
    image: "nginx:1.28.1-alpine3.23"
    ports:
      - "443:443"
      - "80:80"
      - "10000-10009:10000-10009"
    volumes:
      - ./docker/nginx:/etc/nginx
      - ./docker/nginx/sites-enabled/:/etc/nginx/sites-enabled/
      - ./docker/nginx/sites-available/:/etc/nginx/sites-available/
#      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - marketbroker_net
    profiles: [prop-trade-bundle]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    restart: always

networks:
  marketbroker_net:
    name: marketbroker_net-network


volumes:
  questdb-data:
  mysql-data:
  kafka0:
  tempo-data:
  mongo-data:
  mongo-config:
