http {

server {
    listen 443 ssl;
    server_name trade.tradefiapp.com;

    # SSL
    ssl_certificate /etc/nginx/conf.d/domain.crt;
    ssl_certificate_key /etc/nginx/conf.d/domain.key;

    # Recommendations from https://raymii.org/s/tutorials/Strong_SSL_Security_On_nginx.html
    ssl_protocols TLSv1.1 TLSv1.2;
    ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    auth_basic           "tradefiapp";
    auth_basic_user_file /etc/nginx/conf.d/htpasswd;              # tradefiapp_user/password

        location / {
            auth_basic off;
            include proxy_params;
            proxy_pass http://solana-event-listener:3000/;
            error_page 502 =503 @fallback;
        }

        location /marketbroker {
            include proxy_params;
            proxy_pass http://marketbroker:8080/;
            error_page 502 =503 @fallback;
        }

        location /ws/ {
            proxy_pass http://marketbroker:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /topic/ {
            proxy_pass http://marketbroker:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /grafana {
            include proxy_params;
            proxy_pass http://grafana:4000/;
            error_page 502 =503 @fallback;
        }
        location /kafka-console {
            include proxy_params;
            proxy_pass http://kafka-console:8081/;
            error_page 502 =503 @fallback;
        }
        location /questdb {
            include proxy_params;
            proxy_pass http://questdb:9000/;
            error_page 502 =503 @fallback;
        }
        location /prometheus {
            include proxy_params;
            proxy_pass http://prometheus:9090/;
            error_page 502 =503 @fallback;
        }
        location /loki {
            include proxy_params;
            proxy_pass http://loki:3100/;
            error_page 502 =503 @fallback;
        }

    location @fallback {
        root /usr/share/nginx/html;
        internal;
        try_files /fallback.html /index.html =404;
    }
}

}
