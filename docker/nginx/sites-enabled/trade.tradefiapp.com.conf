http {

    server {
        listen 443 ssl;
http2 on;
        server_name trade.tradefiapp.com;

        resolver 127.0.0.11 valid=300s;

        # SSL
        ssl_certificate /etc/nginx/conf.d/domain.crt;
        ssl_certificate_key /etc/nginx/conf.d/domain.key;

        # Recommendations from https://raymii.org/s/tutorials/Strong_SSL_Security_On_nginx.html
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;

        location / {
            include proxy_params;
            set $upstream http://solana-event-listener:3000;
            proxy_pass $upstream;
            error_page 502 503 = @fallback;
        }
        error_page 503 @fallback;
        error_page 502 @fallback;

        location @fallback {
            root /usr/share/nginx/html;
            internal;
            try_files /fallback.html /index.html =404;
        }
    }

    server {
        listen 8080 ssl;
http2 on;
        server_name trade.tradefiapp.com;

        resolver 127.0.0.11 valid=300s;

        # SSL
        ssl_certificate /etc/nginx/conf.d/domain.crt;
        ssl_certificate_key /etc/nginx/conf.d/domain.key;

        # Recommendations from https://raymii.org/s/tutorials/Strong_SSL_Security_On_nginx.html
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;

        auth_basic           "tradefiapp";
        auth_basic_user_file /etc/nginx/conf.d/htpasswd;              # tradefiapp_user/password

        location / {
            include proxy_params;
            set $upstream http://marketbroker:8080;
            proxy_pass $upstream;
            error_page 502 503 = @fallback;
        }

        location /ws/ {
            set $upstream http://marketbroker:8080;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /topic/ {
            set $upstream http://marketbroker:8080;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        error_page 503 @fallback;
        error_page 502 @fallback;

        location @fallback {
            root /usr/share/nginx/html;
            internal;
            try_files /fallback.html /index.html =404;
        }
    }

