services:
    minio:
        restart: always
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        container_name: mlflow_s3
        ports:
            - "9900:9900"
            - "9901:9901"
        command: server /data --console-address ':9901' --address ':9900'
        environment:
            - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID}
            - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY}
        volumes:
            - mlflow_minio_data:/data
        networks:
            - mlflow_net

    mc:
        image: minio/mc:RELEASE.2025-08-13T08-35-41Z
        depends_on:
            - minio
        container_name: mc
        env_file:
            - .env
        entrypoint: >
            /bin/sh -c "
            /tmp/wait-for-it.sh minio:9900 &&
            /usr/bin/mc alias set minio http://minio:9900 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY} &&
            /usr/bin/mc mb minio/mlflow;
            exit 0;
            "
        volumes:
            - ./wait-for-it.sh:/tmp/wait-for-it.sh
        networks:
            - mlflow_net

    db:
        restart: always
        image: mysql:8.0.40-debian
        container_name: mlflow_db
        ports:
            - "3306:3306"
        environment:
            - MYSQL_DATABASE=${MYSQL_DATABASE}
            - MYSQL_USER=${MYSQL_USER}
            - MYSQL_PASSWORD=${MYSQL_PASSWORD}
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
        volumes:
            - mlflow_dbdata:/var/lib/mysql
        networks:
            - mlflow_net

    mlflow:
        restart: always
        build: ./mlflow
        image: mlflow_server
        container_name: mlflow_server
        depends_on:
            - mc
            - db
        ports:
            - "5000:5000"
        environment:
            - MLFLOW_S3_ENDPOINT_URL=http://minio:9900
            - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
            - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
            - MLFLOW_S3_IGNORE_TLS=true
        command: mlflow server --backend-store-uri mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE} --default-artifact-root s3://mlflow/ --host 0.0.0.0 --port=5000
#        command: mlflow server --backend-store-uri mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE} --artifacts-destination s3://mlflow/ --serve-artifacts --host 0.0.0.0 --port=5000
        networks:
            - mlflow_net

    phpmyadmin:
        image: phpmyadmin:5.2.3-apache
        container_name: phpmyadmin
        hostname: phpmyadmin
        environment:
          - PMA_HOST=db
          - PMA_PORT=3306
          - MYSQL_PASSWORD=${MYSQL_PASSWORD}
          - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
          - MYSQL_USER=${MYSQL_USER}
        ports:
          - "8082:80"
        networks:
            - mlflow_net

volumes:
    mlflow_dbdata:
    mlflow_minio_data:

networks:
    mlflow_net:
        name: mlflow_network
