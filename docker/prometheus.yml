# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:

scrape_configs:

  - job_name: 'prometheus'
    scrape_interval: 1m
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

#  - job_name: 'promtail'
#    static_configs:
#      - targets: ['promtail:9080']
#
#  - job_name: 'local-node-exporter'
#    static_configs:
#      - targets: ['node-exporter:9100']
#
#  - job_name: 'caadvisor'
#    static_configs:
#      - targets: ['cadvisor:8080']

  - job_name: 'Marketbroker'
    metrics_path: '/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['host.docker.internal:8090']
        labels:
          application: 'Marketbroker'

