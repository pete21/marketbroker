openapi: 3.1.0
info:
  title: Marketbroker
  version: '1.0'
  summary: Marketbroker API
  description: Marketbroker API
  contact:
    name: piotr.nazarewicz@gmail.com
servers:
  - url: 'http://localhost:3000'
paths:
  /users/{userId}:
    parameters:
      - schema:
          type: integer
        name: userId
        in: path
        required: true
        description: Id of an existing user.
    get:
      summary: Get User Info by User ID
      tags:
        - users
      responses:
        '200':
          description: User Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                Get User Alice Smith:
                  value:
                    id: 142
                    firstName: Alice
                    lastName: Smith
                    email: alice.smith@gmail.com
                    dateOfBirth: '1997-10-31'
                    emailVerified: true
                    signUpDate: '2019-08-24'
        '404':
          description: User Not Found
      operationId: get-users-userId
      description: Retrieve the information of the user with the matching user ID.

    patch:
      summary: Update User Information
      operationId: patch-users-userId
      responses:
        '200':
          description: User Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                Updated User Rebecca Baker:
                  value:
                    id: 13
                    firstName: Rebecca
                    lastName: Baker
                    email: rebecca@gmail.com
                    dateOfBirth: '1985-10-02'
                    emailVerified: false
                    createDate: '2019-08-24'
        '404':
          description: User Not Found
        '409':
          description: Email Already Taken
      description: Update the information of an existing user.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                  description: 'If a new email is given, the user''s email verified property will be set to false.'
                dateOfBirth:
                  type: string
            examples:
              Update First Name:
                value:
                  firstName: Rebecca
              Update Email:
                value:
                  email: rebecca@gmail.com
              Update Last Name & Date of Birth:
                value:
                  lastName: Baker
                  dateOfBirth: '1985-10-02'
        description: Patch user properties to update.
      tags:
        - users

  /accounts:
    get:
      summary: Get Accounts
      tags:
        - accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponseDTO'
      operationId: get-accounts
      description: Get Accounts

  /positions:
    get:
      summary: Get Positions
      tags:
        - positions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PositionResponseDTO'
      operationId: get-positions
      description: Get Positions

  /orders:
    get:
      summary: List Orders
      tags:
        - orders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponseDTO'
      operationId: list-orders

      description: List Orders
    post:
      summary: Create order
      operationId: create-order
      responses:
        '200':
          description: OK
      description: Create order
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequestDTO'
      tags:
        - orders

  /demo/session:
    post:
      summary: Demo session controller
      operationId: demo-session
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTO'
      description: Demo session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionDTO'

      tags:
        - demo
  /instruments/groups:
    get:
      summary: Get Instrument groups
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
      operationId: get-instrument-groups

      tags:
        - instruments
      description: Get Instrument groups
    post:
      summary: Generate Instrument groups
      operationId: post-instrument-groups
      responses:
        '200':
          description: OK

      tags:
        - instruments
      description: Generate Instrument groups
  /instruments/quotes:
    get:
      summary: Get Instrument quotes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
      operationId: get-instrument-quotes

      tags:
        - instruments
      description: Get Instrument quotes
    post:
      summary: Generate Instrument quotes
      operationId: post-instrument-quotes
      responses:
        '200':
          description: OK

      tags:
        - instruments
      description: Generate Instrument quotes
  /publish-json:
    post:
      summary: Publish json data to kafka topic
      tags:
        - kafka
      responses:
        '200':
          description: OK
      operationId: publish-json

      description: Publish json data to kafka topic
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonDataDTO'
  /live/login:
    post:
      summary: Live Login controller
      operationId: live-login
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTO'
      description: Live login controller
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDTO'
      tags:
        - live

  /live/accounts:
    get:
      summary: Get Live accounts
      operationId: get-live-accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LiveAccountDTO'
      description: Get live accounts
      tags:
        - live

  /live/session:
    post:
      summary: Live start session controller
      operationId: live-session
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDTO'
      description: Live session controller
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionDTO'
      tags:
        - live

  /instruments/subscriptions:
    get:
      summary: Get Instrument subscriptions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
      operationId: get-subscriptions
      description: Get subscriptions

      tags:
        - subscriptions
    post:
      summary: Create Instrument subscription
      operationId: create-subscription
      responses:
        '200':
          description: OK
      description: Create subscription

      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionsRequestDTO'
      tags:
        - subscriptions
  '/orders/{id}':
    parameters:
      - schema:
          type: integer
        name: id
        in: path
        required: true
        description: orderId
    get:
      summary: Get Order details
      tags:
        - orders
      responses:
        '200':
          description: OK
      operationId: get-order-by-id
      description: Get order details

    delete:
      summary: Delete open order
      operationId: delete-order-by-id
      responses:
        '200':
          description: OK
      description: Delete open order
      tags:
        - orders

components:
  schemas:
    User:
      title: User
      type: object
      description: 'User'
      examples:
        - id: 142
          firstName: Alice
          lastName: Smith
          email: alice.smith@gmail.com
          dateOfBirth: '1997-10-31'
          emailVerified: true
          signUpDate: '2019-08-24'
      properties:
        id:
          type: integer
          description: Unique identifier for the given user.
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        dateOfBirth:
          type: string
          format: date
          example: '1997-10-31'
        emailVerified:
          type: boolean
          description: Set to true if the user's email has been verified.
        createDate:
          type: string
          format: date
          description: The date that the user was created.
      required:
        - id
        - firstName
        - lastName
        - email
        - emailVerified
    PositionResponseDTO:
      title: PositionResponseDTO
      type: object
      properties:
        positionId:
          type: integer
        marketId:
          type: integer
        quoteId:
          type: integer
        type:
          type: string
        direction:
          type: string
        creationTimeUTC:
          type: string
          format: date-time
        stake:
          type: integer
        openingPriceDecimal:
          type: number
          format: float
        currentPriceDecimal:
          type: number
          format: float
        openPL:
          type: integer
        stopOrderPrice:
          type: string
        limitOrderPrice:
          type: string
        imr:
          type: number
          format: float
        prcGenDecimalPlaces:
          type: integer
        betPer:
          type: number
          format: float
        tradable:
          type: boolean
        isRollingMarket:
          type: boolean
        isTriggered:
          type: boolean
        currencyCode:
          type: string
        isTotal:
          type: boolean
      required:
        - positionId
        - marketId
        - quoteId
        - type
        - direction
        - creationTimeUTC
        - stake
        - openingPriceDecimal
        - currencyCode
    AccountResponseDTO:
      title: AccountResponseDTO
      type: object
      properties:
        accountId:
          type: integer
        platform:
          type: string
        account:
          type: string
        backend:
          type: string
        accountType:
          type: string
        currency:
          type: string
        currencySymbol:
          type: string
        balance:
          type: string
        equity:
          type: string
        ct_login_id:
          type: string
        ct_login_password:
          type: string
      required:
        - accountId
        - platform
        - account
        - backend
        - accountType
        - currency
        - currencySymbol
        - balance
        - equity
        - ct_login_id
        - ct_login_password
    OrderResponseDTO:
      title: OrderResponseDTO
      type: object
      properties:
        orderId:
          type: integer
        currency:
          type: string
        currentPrice:
          type: number
          format: float
        direction:
          type: string
        expiryDate:
          type: string
          format: date-time
        goodTill:
          type: string
          format: date-time
        iDOLimitOrderPrice:
          type: string
        iDOStopOrderPrice:
          type: string
        iDOGuaranteed:
          type: boolean
        isTriggered:
          type: boolean
        limitOrderPrice:
          type: string
        margin:
          type: number
          format: float
        marketID:
          type: integer
        marketTradable:
          type: boolean
        period:
          type: string
        creationTimeUTC:
          type: string
          format: date-time
        quoteId:
          type: integer
        quoteMode:
          type: string
        stake:
          type: integer
        status:
          type: integer
        stopOrderPrice:
          type: string
        type:
          type: string
        trailingPoint:
          type: integer
        isGuarantee:
          type: boolean
        isForceOpen:
          type: boolean
        orderPriceModeEnum:
          type: string
        currencySymbol:
          type: string
      required:
        - orderId
        - currency
        - direction
    SessionDTO:
      title: SessionDTO
      type: object
      properties:
        state:
          type: string
        accountId:
          type: integer
      required:
        - state
    ResponseDTO:
      title: ResponseDTO
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
      required:
        - status
        - message
    JsonDataDTO:
      title: JsonDataDTO
      type: object
      x-class-extra-annotation: '@KafkaTopic(KafkaTopics.TOPIC_JSON_DATA)'
      properties:
        type:
          type: string
        data:
          type: string
      required:
        - type
        - data
    SubscriptionsRequestDTO:
      title: SubscriptionsRequestDTO
      type: object
      properties:
        quoteId:
          type: integer
        status:
          type: boolean
      required:
        - quoteId
        - status
    OrderRequestDTO:
      title: OrderRequestDTO
      type: object
      properties:
        marketId:
          type: integer
        quoteId:
          type: integer
        price:
          type: number
          format: float
        stake:
          type: integer
        direction:
          type: integer
        orderMode:
          type: integer
          description: '0 - market order, 1 - limit order, 2 - stop order, 4 - close position'
        limitOrderPrice:
          type: number
          format: float
        stopOrderPrice:
          type: number
          format: float
        trailingPoint:
          type: integer
        positionId:
          type: integer
          description: for InsertCloseOrder (orderMode==4)
      required:
        - marketId
        - quoteId
        - price
        - stake
        - direction
        - orderMode
        - limitOrderPrice
        - stopOrderPrice
        - trailingPoint
        - positionId
    LoginDTO:
      title: LoginDTO
      type: object
      properties:
        state:
          type: string
        login:
          type: string
        password:
          type: string
    LiveAccountDTO:
      title: LiveAccountDTO
      type: object
      description: Live accounts
      properties:
        id:
          type: integer
          format: int32
        platform:
          type: string
        account:
          type: string
        accountType:
          type: string
        currency:
          type: string
        balance:
          type: number
          format: float
        equity:
          type: number
          format: float
        ct_login_id:
          type: string
        ct_login_password:
          type: string
      required:
        - id
        - platform
        - account
        - accountType
        - currency
        - balance
        - equity
        - ct_login_id
        - ct_login_password
x-internal: true
tags:
  - name: accounts
  - name: demo
  - name: instruments
  - name: kafka
  - name: live
  - name: orders
  - name: positions
  - name: subscriptions
  - name: users
