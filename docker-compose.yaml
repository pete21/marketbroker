# test curl -X POST -H "Content-Type: application/json" -d '{"name":"questdb-marketbroker","config":{"topics":"TICKSTREAM_TOPIC","connector.class":"io.questdb.kafka.QuestDBSinkConnector","tasks.max":"1","key.converter":"org.apache.kafka.connect.storage.StringConverter","value.converter":"org.apache.kafka.connect.json.JsonConverter","value.converter.schemas.enable":"false","client.conf.string":"http::addr=questdb;", "timestamp.kafka.native": true, "include.key": false}}' localhost:8083/connectors
# curl -X POST -H "Content-Type: application/json" -d '{"name":"marketbroker-questdb","config":{"topics":"MARKETBROKER.LOCAL.TICKSTREAM_TOPIC","connector.class":"io.questdb.kafka.QuestDBSinkConnector","tasks.max":"1","key.converter":"org.apache.kafka.connect.storage.StringConverter","value.converter":"org.apache.kafka.connect.json.JsonConverter","value.converter.schemas.enable":"false","client.conf.string":"http::addr=questdb;", "include.key":false, "doubles":"b,a,m", "timestamp.field.name":"t", "timestamp.units":"millis"}}' localhost:8083/connectors

  grafana:
    container_name: grafana
    hostname: grafana
    image: grafana/grafana:12.1.4
    # See: https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#override-configuration-with-environment-variables
    environment:
      #      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - QDB_CLIENT_PG_HOST=questdb
      - QDB_CLIENT_PG_PORT=8812
      - QDB_CLIENT_PG_USER=admin
      - QDB_CLIENT_PG_PASSWORD=quest
      - QDB_SSL_PG_MODE=disable
      - PG_SELECT_CACHE_ENABLED=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor metricsSummary

    ports:
      - "0.0.0.0:3000:3000"
    # See: https://grafana.com/docs/grafana/latest/setup-grafana/configure-docker/
    volumes:
      - ./docker/grafana/var_lib_grafana:/var/lib/grafana/
      - ./docker/grafana/etc_grafana:/etc/grafana/
    networks:
      - marketbroker_net
    profiles: [infra,sdk]

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: prometheus
    hostname: prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker/prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    #    expose:
    #      - 9090
    ports:
      - "0.0.0.0:9091:9090"
    networks:
      - marketbroker_net
    profiles: [infra,sdk]


  loki:
    container_name: loki
    hostname: loki
    image: grafana/loki:3.5.8
    command:
      -config.file=/etc/loki/loki-config.yml
    ports:
      - "0.0.0.0:3100:3100"
    volumes:
      - ./docker/loki-config.yml:/etc/loki/loki-config.yml
    networks:
      - marketbroker_net
    profiles: [infra,sdk]


  tempo:
    container_name: tempo
    hostname: tempo
    image: grafana/tempo:2.9.0
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./docker/tempo.yml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:14268:14268"  # jaeger ingest
      - "127.0.0.1:3200:3200"   # tempo
      - "127.0.0.1:9095:9095" # tempo grpc
      - "127.0.0.1:4317:4317"  # otlp grpc
      - "127.0.0.1:4318:4318"  # otlp http
      - "127.0.0.1:9411:9411"   # zipkin
    networks:
      - marketbroker_net
    profiles: [infra,sdk]
    depends_on:
      - memcached

  memcached:
    image: memcached:1.6.39
    container_name: memcached
    hostname: memcached
    ports:
      - "127.0.0.1:11211:11211"
    environment:
      - MEMCACHED_MAX_MEMORY=64m # Set the maximum memory usage
      - MEMCACHED_THREADS=2 # Number of threads to use
    networks:
      - marketbroker_net
    profiles: [infra,sdk]

