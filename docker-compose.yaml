version: "3"

services:
  marketbroker:
    build:
      dockerfile: docker/Dockerfile
    image: marketbroker:0.1.0
    container_name: marketbroker
    hostname: marketbroker
    ports:
      - "8080:8080"
      - "8090:8090"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - kafka0
      - questdb
      - kafka-connect
#    volumes:
#      - $HOME/.m2:/root/.m2
    networks:
      - marketbroker_net
    profiles: [all]

  kafka0:
    image: bitnami/kafka:3.7.0-debian-12-r2
    container_name: kafka0
    hostname: kafka0
    ports:
      - '9092:9092'
    #  - '9093:9093'
    #  - '9094:9094'
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      #      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092
      #      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://host.docker.internal:9092
      #      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka0:29092,EXTERNAL://localhost:9092

      #      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT
      #      - KAFKA_CFG_LISTENERS=CLIENT://:9092,EXTERNAL://:9093
      #      - KAFKA_CFG_ADVERTISED_LISTENERS=CLIENT://kafka0:9092,EXTERNAL://localhost:9093
      #      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=CLIENT
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_NUM_PARTITIONS=1
  #      - KAFKA_KRAFT_CLUSTER_ID=kafka_id1
  #      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    networks:
      - marketbroker_net


  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    hostname: kafka-ui
    ports:
      - "8081:8081"
#    restart: always
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka0:29092
      - SERVER_PORT=8081
    depends_on:
      - kafka0
    networks:
      - marketbroker_net


  questdb:
    image: questdb/questdb:7.4.0
    container_name: questdb
    ports:
      - "8812:8812"
      - "9000:9000"
      - "9009:9009"
      - "9003:9003"
#    extra_hosts:
#      - "host.docker.internal:host-gateway"
#    user: "501"
    environment:
      - QDB_METRICS_ENABLED=TRUE
      - QDB_WRITERS=stdout,http.min
      - QDB_CAIRO_SQL_COPY_ROOT=/var/lib/questdb/questdb_import
      - QDB_TELEMETRY_ENABLED=false
    volumes:
#      - ./docker/questdb-data:/root/.questdb
      - ./docker/questdb-import:/var/lib/questdb/questdb_import
      - questdb-data:/root/.questdb
    networks:
      - marketbroker_net


  kafka-connect:
#    image: ueisele/apache-kafka-connect-standalone:3.7.0
    image: cricketeerone/apache-kafka-connect:3.6.0
    container_name: kafka_connect
    depends_on:
      - kafka0
      - questdb
    ports:
      - "8083:8083"
#    extra_hosts:
#      - "host.docker.internal:host-gateway"
#    user: "1001"
    volumes:
      - ./docker/kafka_connect_plugins:/etc/kafka-connect/jars     # Mount local directory for plugins
#      - ./docker/kafka_connect_plugins:/opt/bitnami/kafka/plugins
#      - ./docker/kafka_connect_data:/bitnami
#      - ./docker/kafka_connect_config/connect-standalone.properties:/opt/bitnami/kafka/config/connect-standalone.properties
#      - ./docker/kafka_connect_config/questdb-connector.properties:/opt/bitnami/kafka/config/questdb-connector.properties
#    command: /opt/bitnami/kafka/bin/connect-standalone.sh /opt/bitnami/kafka/config/connect-standalone.properties /opt/bitnami/kafka/config/questdb-connector.properties
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka0:29092
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: false
      CONNECT_GROUP_ID: kafka_connect
      CONNECT_CONFIG_STORAGE_TOPIC: connect_config
      CONNECT_OFFSET_STORAGE_TOPIC: connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect_status
      # Cannot be higher than the number of brokers in the Kafka cluster
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka_connect
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 5000
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1

      # Connect client overrides
      CONNECT_TASK_SHUTDOWN_GRACEFUL_TIMEOUT_MS: 30000
      # Connect consumer overrides
      CONNECT_CONSUMER_MAX_POLL_RECORDS: 500

      CONNECT_PLUGIN_PATH: /etc/kafka-connect/jars
    networks:
      - marketbroker_net

#    command:
#      - bash
#      - -c
#      - |
#        echo "Waiting for Kafka Connect to start listening on localhost ⏳"
#        while : ; do
#          curl_status=$$(curl -s -o /dev/null -w %{http_code} http://localhost:8083/connectors)
#          echo -e $$(date) " Kafka Connect listener HTTP state: " $$curl_status " (waiting for 200)"
#          if [ $$curl_status -eq 200 ] ; then
#            break
#          fi
#          sleep 5
#        done
#        echo -e "\n--\n+> Registering QuestDB Connector"
#        curl -X POST -H "Content-Type: application/json" -d '{"name":"questdb-connect","config":{"topics":"MARKETBROKER.LOCAL.TICKSTREAM_TOPIC","connector.class":"io.questdb.kafka.QuestDBSinkConnector","tasks.max":"1","key.converter":"org.apache.kafka.connect.storage.StringConverter","value.converter":"org.apache.kafka.connect.json.JsonConverter","value.converter.schemas.enable":"false","client.conf.string":"http::addr=questdb;", "include.key":false, "timestamp.field.name":"t", "timestamp.units":"millis"}}' localhost:8083/connectors
#        sleep infinity

# test curl -X POST -H "Content-Type: application/json" -d '{"name":"questdb-marketbroker","config":{"topics":"TICKSTREAM_TOPIC","connector.class":"io.questdb.kafka.QuestDBSinkConnector","tasks.max":"1","key.converter":"org.apache.kafka.connect.storage.StringConverter","value.converter":"org.apache.kafka.connect.json.JsonConverter","value.converter.schemas.enable":"false","client.conf.string":"http::addr=questdb;", "timestamp.kafka.native": true, "include.key": false}}' localhost:8083/connectors
# curl -X POST -H "Content-Type: application/json" -d '{"name":"marketbroker-questdb","config":{"topics":"MARKETBROKER.LOCAL.TICKSTREAM_TOPIC","connector.class":"io.questdb.kafka.QuestDBSinkConnector","tasks.max":"1","key.converter":"org.apache.kafka.connect.storage.StringConverter","value.converter":"org.apache.kafka.connect.json.JsonConverter","value.converter.schemas.enable":"false","client.conf.string":"http::addr=questdb;", "include.key":false, "doubles":"b,a,m", "timestamp.field.name":"t", "timestamp.units":"millis"}}' localhost:8083/connectors

  grafana:
    container_name: grafana
    image: grafana/grafana:10.4.2
    # See: https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#override-configuration-with-environment-variables
    environment:
      #      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - QDB_CLIENT_PG_HOST=questdb
      - QDB_CLIENT_PG_PORT=8812
      - QDB_CLIENT_PG_USER=admin
      - QDB_CLIENT_PG_PASSWORD=quest
      - QDB_SSL_PG_MODE=disable
      - PG_SELECT_CACHE_ENABLED=false

    ports:
      - "3000:3000"
    # See: https://grafana.com/docs/grafana/latest/setup-grafana/configure-docker/
    volumes:
      - ./docker/grafana/var_lib_grafana:/var/lib/grafana/
      - ./docker/grafana/etc_grafana:/etc/grafana/
    networks:
      - marketbroker_net


  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker/prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    #    expose:
    #      - 9090
    ports:
      - "9090:9090"
    networks:
      - marketbroker_net


  loki:
    container_name: loki
    image: grafana/loki:main-a199662
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki-config.yml:/etc/loki/loki-config.yml
    networks:
      - marketbroker_net


  tempo:
    container_name: tempo
    image: grafana/tempo:2.3.1
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./docker/tempo.yml:/etc/tempo.yaml
      - ./docker/tempo-data:/tmp/tempo
    ports:
      - "14268:14268"  # jaeger ingest
      - "3200:3200"   # tempo
      - "9095:9095" # tempo grpc
      - "4317:4317"  # otlp grpc
      - "4318:4318"  # otlp http
      - "9411:9411"   # zipkin
    networks:
      - marketbroker_net

  jupyter-notebook:
    image: quay.io/jupyter/tensorflow-notebook:tensorflow-2.16.1
    container_name: jupyter
    volumes:
      - ./notebooks:/home/jovyan
    ports:
      - "8888:8888"
    command: sh -c "pip install questdb psycopg[binary] psycopg2-binary kafka-python confluent-kafka \"confluent-kafka[avro]\" fastavro requests \
      && start-notebook.sh --NotebookApp.password= --NotebookApp.token="
#    toolz cytoolz \
#    plotly \
#    hyperopt \
#    fitter \
#    xgboost \
#    seaborn \
#    bayesian-optimization \
#    pandas_summary \
#    setuptools \
#    gputil \
#    rl_zoo3 \
#    stable-baselines3[extra] \
#    cmake openmpi \
#    git+https://github.com/AI4Finance-Foundation/FinRL.git \
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - RESTARTABLE=yes
#      - DOCKER_STACKS_JUPYTER_CMD=notebook
    networks:
      - marketbroker_net


networks:
  marketbroker_net:

volumes:
  questdb-data: